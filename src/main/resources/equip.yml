# ============================================================
#  MobInteract - equip.yml
#  出生装备总概率（镐子 + 方块）
#  修改后可用 /mobinteract reload 热重载。
# ============================================================

# 总闸门：怪物出生时“会不会拿到镐子 / 方块”。
# 通过闸门后，再按 mining.yml 的 tool.give.chance 决定镐子、
# 按 placement.yml 的 backpack.chance 决定方块。
# 所以“带镐子 + 带方块”的怪物比例加起来不会超过这里的值。
# 默认 0.10 = 主世界最多 10% 的怪物会带东西。
chance: 0.10

# 按世界单独覆盖上面的概率（世界名 = 服务器目录里的世界文件夹名，不区分大小写）。
# 没列出来的世界用上面的全局值。
#   world: 0.10
#   world_nether: 0.30
#   world_the_end: 0.0     # 末地完全不给装备
# 注意：这里只控制“出生装备”；与 mining.yml / placement.yml 里的 worlds 黑白名单是两件事
#      （黑白名单决定“这个世界的怪物要不要参与挖掘 / 放置”）。
worlds: {}
