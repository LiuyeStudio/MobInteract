# ============================================================
#  MobInteract - targeting.yml
#  索敌偏好：优先追杀玩家
#  修改后可用 /mobinteract reload 热重载。
# ============================================================

# 总开关。true 时，被插件接管的怪物每隔若干 tick 检查一次：
# 附近只要有“可追的玩家”（生存 / 冒险模式），就把目标切成最近的玩家。
# 已经在追玩家的怪物不会来回换目标。
enabled: true

# 索敌半径（格）。玩家在这个范围内才会被优先锁定；调小 = 只盯近处的玩家。
radius: 16.0

# 检查间隔（tick）。10 = 每秒 2 次；调大更省性能但反应慢一些。
interval-ticks: 10

# 是否要求“能看见玩家”才切换。
# false（默认）= 隔着墙也会朝玩家走；配合插件的挖掘 / 搭路，就是“拆墙过来”。
# true = 只有看得见玩家时才优先，行为更接近原版。
require-line-of-sight: false

# 附近没有可追玩家时，如何对待原来的目标（通常是村民 / 铁傀儡）。
# true（默认）= 保留原版选的目标，继续干原来的事。
# false = 主动清空目标，专心找玩家（更“猎杀玩家”）。
keep-villager-target: true
