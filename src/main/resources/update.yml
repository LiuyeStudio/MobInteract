# ============================================================
#  MobInteract - update.yml
#  检查更新：启动后在后台访问 GitHub Releases，比对本插件版本号，
#  发现新版本时提示控制台与在线管理员。
#
#  说明：
#   - 只读 GitHub 的公开接口，不发送服务器地址、玩家信息或任何标识。
#   - 请求在异步线程执行，连不上 / 超时 / 被墙都只是安静地跳过，
#     不会卡主线程，也不影响挖掘、放置等其他功能。
#   - 不想让它联网，把下面的 enabled 改成 false 即可。
#   - 改完可用 /mobinteract reload 生效（会重新排检查任务）。
# ============================================================

# 总开关。false = 完全不发起任何网络请求。
enabled: true

# 去哪个仓库查版本（owner/repo）。
# 正常使用不用改；如果你是自己二改后分发，建议改成自己的仓库，
# 否则会一直提示别人的新版本。
repository: 'LiuyeStudio/MobInteract'

# 服务器启动后等多少秒做第一次检查。
# 留一点余量，避免和开服时的区块加载、自动保存抢带宽。
first-delay-seconds: 60

# 之后每隔多少小时再检查一次。
# 写 0 = 只在启动后检查一次，之后不再自动检查（仍然可以用 /mobinteract update 手动查）。
interval-hours: 6

# 发现新版本时，是否在控制台打印（推荐开着，多数服主只看后台）。
console: true

# 发现新版本时，是否私聊当前在线的管理员（需要 mobinteract.admin 权限）。
notify-online-admins: true

# 发现新版本时，是否在管理员上线时私聊提醒。
# 用的是最近一次的检查结果，不会额外请求 GitHub；每名玩家每次开服只提醒一次。
notify-on-join: true

# 是否把预发布版（pre-release）也算作新版本。
# 默认 false：只认正式 Release，避免把测试版推给生产服。
include-prerelease: false

# 网络超时（秒）。连不上 GitHub 时最多等这么久就放弃本次检查。
timeout-seconds: 8

# 调试：把每次检查的 HTTP 状态码、解析出的版本号写进控制台，
# 用来排查“为什么没有提示更新”。
debug: false
